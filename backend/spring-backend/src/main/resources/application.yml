server:
  port: 3000
  servlet:
    context-path: /api

spring:
  datasource:
    url: jdbc:h2:file:./data/schooldb;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        "[format_sql]": true
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  jwt:
    secret: "change-this-secret-key"
    expiration-seconds: 86400
