<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>TriLearn - Education Management Platform</title>
    <meta name="description" content="Connect teachers, parents, and learners on one powerful education management platform. Track attendance, manage assignments, capture marks, and communicate seamlessly." />
    <link rel="icon" type="image/svg+xml" href="/placeholder.svg" />
    
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="EduConnect" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- Open Graph -->
    <meta property="og:title" content="EduConnect - Education Management Platform" />
    <meta property="og:description" content="Connect teachers, parents, and learners on one powerful education management platform." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og.jpg" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="EduConnect - Education Management Platform" />
    <meta name="twitter:description" content="Connect teachers, parents, and learners on one powerful education management platform." />
    <meta name="twitter:image" content="/og.jpg" />
  </head>

  <body>
    <div id="root"></div>                                                                                       <!--- React app will mount here -->
    <script type="module" src="/src/main.tsx"></script> //-
    <script>
      
      if ('serviceWorker' in navigator)                                                                         <!--- Register service worker for PWA -->
      {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('SW registered:', registration);
            })
            .catch((error) => {
              console.log('SW registration failed:', error);
            });
        });
      }
    </script>
  </body>
</html>
